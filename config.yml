<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Группа Кино — билеты</title>
<style>
  :root {
    --bg: #0f0f13;
    --card: #17171d;
    --accent: #e63946;
    --text: #f2f2f2;
    --muted: #9a9aa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 28px;
    margin: 0 0 4px;
  }
  .date {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 24px;
  }
  .tl_button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .tl_button:hover {
    background: #d62839;
    transform: translateY(-1px);
  }
  #tlFrameContainer {
    margin-top: 24px;
    min-height: 400px;
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Группа Кино</h1>
  <div class="date">12.10.2026, пн · 19:00</div>

  <!-- Кнопка pop-up -->
  <button class="tl_button" onclick="window.TLIframe.showPopup({url: 'https://ufa.ticketland.ru/iframe-direct-sale/4jnyX9eBJWj4kFLRNRqoUcB1_elQVvU/'});">
    Купить билет
  </button>

  <!-- Встраиваемый виджет -->
  <div id="tlFrameContainer" data-start="https://ufa.ticketland.ru/iframe-direct-sale/4jnyX9eBJWj4kFLRNRqoUcB1_elQVvU/"></div>

  <div class="hint">Продажа билетов через Ticketland</div>
</div>

<!-- Шаг 1: скрипт виджета -->
<script type="text/javascript">
    var TLConf = {
        accessHash: "accc4dbd7f188a9f00867211658af238",
        version: 1,
    };
</script>
<script async src="https://www.ticketland.ru/iframe/loaderJs/"></script>

</body>
</html>
